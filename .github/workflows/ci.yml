name: FestivaPlan AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    name: Code Quality, Testing & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Automated Unit & Integration Tests (10 Suites)
        run: npm test

      - name: Compile & Build Production Bundle with Vite
        run: npm run build

      - name: Verify Bundle Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          echo "Production build successfully verified!"

